plugins {
    id 'com.gradleup.shadow'
    id "net.darkhax.curseforgegradle" version "1.1.28"
    id "com.github.breadmoirai.github-release" version "2.4.1"
    id "com.modrinth.minotaur" version "2.+"
}

def platform = project.name

architectury {
    platformSetupLoomIde()
    fabric()
}

fabricApi {
    configureDataGeneration() {
        client = true
        modId = "loot_n_explore"
        outputDirectory = project(':common').file('src/main/generated')
    }
}


configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://maven.fabricmc.net' }
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.azuredoom.com/mods' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven { url 'https://jitpack.io' }
    mavenLocal()
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation("maven.modrinth:structure-pool-api:${project.structure_pool_api_version}-${platform}")
    modImplementation("dev.kosmx.player-anim:player-animation-lib-${platform}:${project.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")
    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}")
    modLocalRuntime("com.github.thedeathlycow:thermoo:${project.thermoo_version}")

    modLocalRuntime("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
    modCompileOnly("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
    modLocalRuntime("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
    modLocalRuntime("maven.modrinth:more-rpg-library:${project.more_rpg_library_version}-${platform}")
    modLocalRuntime("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}")
    modCompileOnly("maven.modrinth:witcher-rpg-class:${project.witcher_version}-${platform}")
    modCompileOnly("maven.modrinth:relics-rpg:${project.relics_version}-${platform}")
    modCompileOnly("maven.modrinth:critical-strike:${project.critical_strike_version}-${platform}")

    modImplementation("maven.modrinth:trinkets:${project.trinkets_version}")
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.3"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.3"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand(project.properties)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

def changelog_last_section() {
    def changelogFile = rootProject.file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return "No changelog available"
    }
    def content = changelogFile.text
    def sections = content.split(/(?m)(?=^# )/)
    def recentSection = sections.find { it.trim().startsWith('#') }
    return recentSection ?: "No changelog available"
}

def release_type = project.hasProperty('release_type') ? project.property('release_type') : 'release'

if (System.getenv("CURSEFORGE_API_KEY")) {
    tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        apiToken = System.getenv("CURSEFORGE_API_KEY")

        def mainFile = upload(System.getenv("CURSEFORGE_PROJECT_ID"), remapJar)
        mainFile.changelog = changelog_last_section()
        mainFile.changelogType = 'markdown'
        mainFile.releaseType = release_type
        mainFile.addGameVersion("${project.minecraft_version}")
        mainFile.addModLoader("Fabric")
        mainFile.addEnvironment("Client")
        mainFile.addEnvironment("Server")

        mainFile.addRequirement('fabric-api')
        mainFile.addRequirement('structure-pool-api')
        mainFile.addOptional('spell-engine')
        mainFile.addOptional('more-rpg-library')
    }
    tasks.curseforge.dependsOn remapJar
}

if (System.getenv("MODRINTH_API_KEY")) {
    modrinth {
        token = System.getenv("MODRINTH_API_KEY")
        projectId = System.getenv("MODRINTH_PROJECT_ID")
        versionName = "${version}-${platform}"
        versionNumber = "${version}-${platform}"
        versionType = release_type
        uploadFile = remapJar
        gameVersions = ["${project.minecraft_version}"]
        loaders = ["fabric"]
        changelog = changelog_last_section()
        dependencies {
            required.project 'fabric-api'
            required.project 'structure-pool-api'
            optional.project 'spell-engine'
            optional.project 'more-rpg-library'
        }
    }
    tasks.modrinth.dependsOn remapJar
}

if (System.getenv("GH_API_KEY")) {
    githubRelease {
        token System.getenv("GH_API_KEY")
        owner System.getenv("GH_OWNER")
        repo System.getenv("GH_REPO")
        tagName "${version}"
        targetCommitish System.getenv("GH_BRANCH")
        releaseName "Release"
        generateReleaseNotes false
        body changelog_last_section()
        draft false
        prerelease false
        overwrite true
        releaseAssets remapJar.archiveFile
    }
    tasks.githubRelease.dependsOn remapJar
}

tasks.register('publishMod') {
    group = 'publishing'
    description = 'Publishes the mod to CurseForge, Modrinth, and GitHub'
    dependsOn(tasks.remapJar)
    if (System.getenv("CURSEFORGE_API_KEY")) {
        finalizedBy(tasks.curseforge)
    }
    if (System.getenv("MODRINTH_API_KEY")) {
        finalizedBy(tasks.modrinth)
    }
    if (System.getenv("GH_API_KEY")) {
        finalizedBy(tasks.githubRelease)
    }
}
