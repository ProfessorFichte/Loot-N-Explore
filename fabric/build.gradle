plugins {
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
    id 'com.gradleup.shadow'
}

def platform = project.name

architectury {
    platformSetupLoomIde()
    fabric()
}

fabricApi {
    configureDataGeneration() {
        client = true
        modId = "loot_n_explore"
        outputDirectory = project(':common').file('src/main/generated')
    }
}


configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://maven.fabricmc.net' }
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.azuredoom.com/mods' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven { url 'https://jitpack.io' }
    mavenLocal {
        content {
            excludeModule 'maven.modrinth', 'more-rpg-library'
        }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation("maven.modrinth:structure-pool-api:${project.structure_pool_api_version}-${platform}")
    modImplementation("dev.kosmx.player-anim:player-animation-lib-${platform}:${project.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")
    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}")
    modCompileOnly("com.github.thedeathlycow:thermoo:${project.thermoo_version}")

    modCompileOnly("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
    modCompileOnly("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
    modCompileOnly("maven.modrinth:more-rpg-library:${project.more_rpg_library_version}-${platform}")
    modLocalRuntime("maven.modrinth:more-rpg-library:${project.more_rpg_library_version}-${platform}")
    modCompileOnly("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}")
    modCompileOnly("maven.modrinth:witcher-rpg-class:${project.witcher_version}-${platform}")
    modCompileOnly("maven.modrinth:relics-rpg:${project.relics_version}-${platform}")
    modCompileOnly("maven.modrinth:critical-strike:${project.critical_strike_version}-${platform}")

    modCompileOnly("maven.modrinth:trinkets:${project.trinkets_version}")
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.3"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.3"
}

apply from: rootProject.file("workspace-runtime.gradle")

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand(project.properties)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

def changelog_last_section() {
    def changelogFile = rootProject.file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return "No changelog available"
    }
    def content = changelogFile.text
    def releases = content.split(/(?m)(?=^## \[)/).findAll { it.startsWith('## [') && !it.startsWith('## [Unreleased]') }
    if (releases) {
        return releases.first().replaceAll(/(?m)^\[[^\]]+\]: .*$/, '').trim()
    }
    return "No changelog available"
}

def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

tasks.register("publishMod") {
    dependsOn(build)
    finalizedBy(tasks.named("publishMods"))
}

publishMods {
    file = remapJar.archiveFile
    changelog = providers.environmentVariable("MOD_CHANGELOG").orElse(providers.provider { changelog_last_section() })
    type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA
    version = "${project.version}-${platform}"
    displayName = "${project.version}-${platform}"
    modLoaders.add("fabric")

    curseforge {
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        client = true
        server = true
        changelogType = "markdown"
        requires("fabric-api", "structure-pool-api", "more-rpg-library")
        optional("spell-engine")
    }

    modrinth {
        environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.CLIENT_AND_SERVER
        projectId = providers.environmentVariable("MODRINTH_PROJECT_ID")
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        requires { slug = "fabric-api" }
        requires { slug = "structure-pool-api" }
        requires { slug = "more-rpg-library" }
        optional { slug = "spell-engine" }
    }

    github {
        repository = providers.environmentVariable("GH_OWNER")
                .zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
        accessToken = providers.environmentVariable("GH_API_KEY")
        tagName = "${project.version}-${platform}"
        commitish = providers.environmentVariable("GITHUB_SHA")
    }
}

tasks.named("publishGithub") {
    mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
