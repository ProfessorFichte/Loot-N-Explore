# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.1
loader_version=0.19.5
# Oldest loader this mod actually runs on. NOT the build version above -
# driving the manifest from that would over-declare the requirement.
fabric_loader_compat_version=0.15.10

# Mod Properties
# Game-version port: only the 4th version part moves. The build appends
# "+${minecraft_version}", so the artifact is 1.0.22.001+1.20.1.
mod_version=1.0.22.001
maven_group=com.example
archives_base_name=loot_n_explore

# Dependencies
fabric_version=0.92.12+1.20.1
cloth_config_version=11.1.106
tiny_config_version=3.1.0.001
mixin_extras_version=0.5.5

# Optional
spell_power_version=1.6.0.002+1.20.1
player_anim_version=1.0.2+1.19.4
trinkets_version=3.7.2
cardinal_components_version=5.2.0
spell_engine_version=1.10.5.017+1.20.1
more_rpg_library_version=2.7.2.005+1.20.1
witcher_version=3.1.1.001+1.20.1
ranged_weapon_api_version=2.3.4.002+1.20.1
structure_pool_api_version=1.2.1.001+1.20.1
thermoo_version=v2.3
relics_version=1.4.0.002+1.20.1
# Not used in code; More-RPG-Library ships `runes:crafting` recipes that need it to parse.
# Dev-runtime pin only.
runes_version=1.3.2.001+1.20.1
loom.platform=fabric
