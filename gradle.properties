# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.1
loader_version=0.19.5
# Oldest loader this mod actually runs on. NOT the build version above -
# driving the manifest from that would over-declare the requirement.
fabric_loader_compat_version=0.15.10

# Mod Properties
# Release version. The build appends "+${minecraft_version}", so the artifact is
# 1.0.22+1.20.1. (The 1.21.1 branch bakes the game version into this string instead:
# `1.0.22-1.21.1`. Keep this branch's shape.)
mod_version=1.0.22
maven_group=com.example
archives_base_name=loot_n_explore

# Dependencies
fabric_version=0.92.12+1.20.1
cloth_config_version=11.1.106
# Modrinth maven coordinates: maven.modrinth:tiny-config:<version>-fabric
tiny_config_version=3.1.0+1.20.1
mixin_extras_version=0.5.5

# Optional
# Modrinth maven coordinates: maven.modrinth:spell-power:<version>-fabric
spell_power_version=1.6.0+1.20.1
player_anim_version=1.0.2+1.19.4
trinkets_version=3.7.2
cardinal_components_version=5.2.0
# Modrinth maven coordinates: maven.modrinth:spell-engine:<version>-fabric
spell_engine_version=1.10.5+1.20.1
# Modrinth maven coordinates: maven.modrinth:more-rpg-library:<version>-fabric
# Resolves once More RPG Library's 1.20.1 release (release tier 1) is published.
more_rpg_library_version=2.7.2+1.20.1
# Modrinth maven coordinates: maven.modrinth:witcher-rpg-class:<version>-fabric
# Compile-only: the Witcher compat effects read Witcher's attributes when it is installed.
witcher_version=3.1.2+1.20.1
# Modrinth maven coordinates: maven.modrinth:ranged-weapon-api:<version>-fabric
# 2.x, never 3.x: the 3.x line is attribute-driven and this mod is written against 2.x.
ranged_weapon_api_version=2.3.4+1.20.1
# Modrinth maven coordinates: maven.modrinth:structure-pool-api:<version>-fabric
# Hard dependency (declared in fabric.mod.json).
structure_pool_api_version=1.2.1+1.20.1
thermoo_version=v2.3
# Modrinth maven coordinates: maven.modrinth:relics-rpg:<version>-fabric
# Compile-only, and currently unused: no source file on this branch imports net.relics_rpgs.
relics_version=1.4.0+1.20.1
# Not used in code; More-RPG-Library ships `runes:crafting` recipes that need it to parse.
# Dev-runtime pin only.
# Modrinth maven coordinates: maven.modrinth:runes:<version>-fabric
runes_version=1.3.2+1.20.1
loom.platform=fabric
