plugins {
	id "me.modmuss50.mod-publish-plugin" version "2.1.1"
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

fabricApi {
	configureDataGeneration() {
		client = true
		modId = "loot_n_explore"
	}
}


repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	mavenLocal()
	maven { url = 'https://maven.kosmx.dev/' }
	maven { url = 'https://maven.shedaniel.me/' }
	maven {
		url = 'https://jitpack.io'
		content {
			excludeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		url = "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Ladysnake Libs"
		url = 'https://maven.ladysnake.org/releases'
	}

	// The Maven with the mods source
	maven {
		name = "AzureDoom Mods"
		url = "https://maven.azuredoom.com/mods"
	}
}

// Single-module Fabric-only build. Declared like one half of an Architectury setup so the
// Modrinth loader suffix lives in the coordinate, and gradle.properties holds bare versions.
def platform = "fabric"

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Uncomment the following line to enable the deprecated Fabric API modules.
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	//FABRIC
	include(implementation("com.github.LlamaLad7:MixinExtras:${project.mixin_extras_version}"))
	annotationProcessor("com.github.LlamaLad7:MixinExtras:${project.mixin_extras_version}")
	modApi("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}") {exclude(group: "net.fabricmc.fabric-api")}
	include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.2.0-rc.4")))

	//DEPENDENCIES
	modImplementation("maven.modrinth:structure-pool-api:${project.structure_pool_api_version}-${platform}")
	include(modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}"))

	//OPTIONAL
	modImplementation "com.github.thedeathlycow:thermoo:${project.thermoo_version}"
	modImplementation("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}")
	modImplementation("dev.kosmx.player-anim:player-animation-lib-${platform}:${project.player_anim_version}")
	modImplementation("dev.emi:trinkets:${project.trinkets_version}")
	modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
	modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
	modImplementation("net.more_rpg_classes:more_rpg_library-${platform}:${project.more_rpg_library_version}") { transitive = false }
	modCompileOnly("net.witcher_class:witcher-class-mod-${platform}:${project.witcher_version}") { transitive = false }
	modCompileOnly("maven.modrinth:relics-rpg:${project.relics_version}-${platform}")

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand(project.properties)
	}
}


tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Function to read the last section from CHANGELOG.md
def changelog_last_section() {
	def changelogFile = rootProject.file('CHANGELOG.md')
	if (!changelogFile.exists()) {
		return "No changelog available"
	}

	def content = changelogFile.text
	def sections = content.split(/(?m)(?=^# )/)
	def recentSection = sections.find { it.trim().startsWith('#') }
	return recentSection ?: "No changelog available"
}

// Publishing configuration -- single-module, Fabric only, so there is no loader suffix.
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Local convenience alias -- CI invokes the per-destination publish tasks directly.
tasks.register("publishMod") {
	dependsOn(build)
	finalizedBy(tasks.named("publishMods"))
}

publishMods {
	file = remapJar.archiveFile
	changelog = providers.provider { changelog_last_section() }
	type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
			: releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
			: me.modmuss50.mpp.ReleaseType.BETA
	version = "${project.version}"
	displayName = "${project.version}"
	modLoaders.add("fabric")

	curseforge {
		projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")
		accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
		minecraftVersions.add(project.minecraft_version)
		client = true
		server = true
		changelogType = "markdown"
		requires("fabric-api", "structure-pool-api")
	}

	modrinth {
		environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.CLIENT_AND_SERVER
		projectId = providers.environmentVariable("MODRINTH_PROJECT_ID").orElse(providers.environmentVariable("MODRINTH_PROJECT_RAW_ID"))
		accessToken = providers.environmentVariable("MODRINTH_API_KEY")
		minecraftVersions.add(project.minecraft_version)
		requires { slug = "fabric-api" }
		requires { slug = "structure-pool-api" }
	}

	github {
		repository = providers.environmentVariable("GH_OWNER")
				.zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
		accessToken = providers.environmentVariable("GH_API_KEY")
		tagName = "${project.version}"
		commitish = providers.environmentVariable("GITHUB_SHA")
	}
}

// GitHub release last: a failed mod upload aborts the build before the release exists.
// Ordering only -- unselected tasks are ignored. Must sit after the publishMods block.
tasks.named("publishGithub") {
	mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
