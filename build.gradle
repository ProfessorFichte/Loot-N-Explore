plugins {
	id "me.modmuss50.mod-publish-plugin" version "2.1.1"
	// Architectury Loom, not plain fabric-loom: the 1.20.1 ecosystem artifacts in mavenLocal are
	// built with Loom 1.17, and fabric-loom's newest release refuses to consume them
	// ("Mod was built with a newer version of Loom"). Still a single-module, Fabric-only build --
	// no architectury-plugin, no common/forge split.
	id 'dev.architectury.loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
}

// The 1.21.1 branch baked the game version into `mod_version` (`1.0.22-1.21.1`).
// This branch keeps a bare semver in `mod_version` and appends the game version here,
// matching the rest of the workspace: 1.0.22+1.20.1
version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

fabricApi {
	configureDataGeneration() {
		client = true
		modId = "loot_n_explore"
	}
}


repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = 'https://maven.kosmx.dev/' }
	maven { url = 'https://maven.shedaniel.me/' }
	maven {
		url = 'https://jitpack.io'
		content {
			excludeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		url = "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Ladysnake Libs"
		url = 'https://maven.ladysnake.org/releases'
	}
}

// Single-module Fabric-only build. Declared like one half of an Architectury setup so the
// Modrinth loader suffix lives in the coordinate, and gradle.properties holds bare versions.
def platform = "fabric"

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Uncomment the following line to enable the deprecated Fabric API modules.
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	//FABRIC
	modApi("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}") {exclude(group: "net.fabricmc.fabric-api")}
	include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${project.mixin_extras_version}")))

	//DEPENDENCIES
	// Ecosystem libraries come from the Modrinth maven. This is a single-module build, so there is no
	// `${platform}` to interpolate into the classifier the way the multi-module repos do it: Modrinth
	// serves per-loader jars and this mod is Fabric-only, so the `-fabric` flavour is spelled out.
	modImplementation("maven.modrinth:structure-pool-api:${project.structure_pool_api_version}-fabric") { transitive = false }
	include(modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-fabric")) { transitive = false }

	//OPTIONAL
	modImplementation "com.github.thedeathlycow:thermoo:${project.thermoo_version}"
	modImplementation("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-fabric") { transitive = false }
	modImplementation("dev.kosmx.player-anim:player-animation-lib-${platform}:${project.player_anim_version}")
	modImplementation("dev.emi:trinkets:${project.trinkets_version}")
	// Trinkets 3.7.2 does not bring its own Cardinal Components on this line.
	modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}")
	modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}")
	modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-fabric") { transitive = false }
	modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}-fabric") { transitive = false }
	// Resolves once More RPG Library's 1.20.1 release (release tier 1) is published.
	modImplementation("maven.modrinth:more-rpg-library:${project.more_rpg_library_version}-fabric") { transitive = false }
	// Resolves once Witcher's 1.20.1 release is published (it must ship before this mod).
	modCompileOnly("maven.modrinth:witcher-rpg-class:${project.witcher_version}-fabric") { transitive = false }
	// Modrinth's project slug is `relics-rpg`, not `relics`.
	modCompileOnly("maven.modrinth:relics-rpg:${project.relics_version}-fabric") { transitive = false }
	// Dev runtime only: More-RPG-Library ships `runes:crafting` recipes that fail to parse without it.
	modLocalRuntime("maven.modrinth:runes:${project.runes_version}-fabric") { transitive = false }

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		// Explicit map, not `project.properties`: the map form drags the whole Project into the
		// task and trips Gradle 9's configuration checks.
		expand version: project.version,
				fabric_loader_compat_version: project.fabric_loader_compat_version
	}
}


tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Function to read the last section from CHANGELOG.md
def changelog_last_section() {
	def changelogFile = rootProject.file('CHANGELOG.md')
	if (!changelogFile.exists()) {
		return "No changelog available"
	}

	def content = changelogFile.text
	def sections = content.split(/(?m)(?=^# )/)
	def recentSection = sections.find { it.trim().startsWith('#') }
	return recentSection ?: "No changelog available"
}

// Publishing configuration -- single-module, Fabric only, so there is no loader suffix.
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Local convenience alias -- CI invokes the per-destination publish tasks directly.
tasks.register("publishMod") {
	dependsOn(build)
	finalizedBy(tasks.named("publishMods"))
}

publishMods {
	file = remapJar.archiveFile
	changelog = providers.provider { changelog_last_section() }
	type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
			: releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
			: me.modmuss50.mpp.ReleaseType.BETA
	version = "${project.version}"
	displayName = "${project.version}"
	modLoaders.add("fabric")

	curseforge {
		projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")
		accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
		minecraftVersions.add(project.minecraft_version)
		client = true
		server = true
		changelogType = "markdown"
		requires("fabric-api", "structure-pool-api")
	}

	modrinth {
		environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.CLIENT_AND_SERVER
		projectId = providers.environmentVariable("MODRINTH_PROJECT_ID").orElse(providers.environmentVariable("MODRINTH_PROJECT_RAW_ID"))
		accessToken = providers.environmentVariable("MODRINTH_API_KEY")
		minecraftVersions.add(project.minecraft_version)
		requires { slug = "fabric-api" }
		requires { slug = "structure-pool-api" }
	}

	github {
		repository = providers.environmentVariable("GH_OWNER")
				.zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
		accessToken = providers.environmentVariable("GH_API_KEY")
		tagName = "${project.version}"
		commitish = providers.environmentVariable("GITHUB_SHA")
	}
}

// GitHub release last: a failed mod upload aborts the build before the release exists.
// Ordering only -- unselected tasks are ignored. Must sit after the publishMods block.
tasks.named("publishGithub") {
	mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
