def flags = rootProject.ext.runtimeWorkspace
def fabric = project.name == 'fabric'
def platform = project.name

if (flags.workspace_spell_engine) {
    dependencies.add('modLocalRuntime', "maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
    dependencies.add('modLocalRuntime', "maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
    dependencies.add('modLocalRuntime', "maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}")
}

if (fabric && flags.workspace_trinkets) {
    dependencies.add('modLocalRuntime', "maven.modrinth:trinkets:${project.trinkets_version}")
    dependencies.add('modLocalRuntime', "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.3")
    dependencies.add('modLocalRuntime', "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.3")
}

if (fabric && flags.workspace_thermoo) {
    dependencies.add('modLocalRuntime', "com.github.thedeathlycow:thermoo:${project.thermoo_version}")
}

if (!fabric && flags.workspace_curios) {
    dependencies.add('modLocalRuntime', "top.theillusivec4.curios:curios-neoforge:${project.curios_version}")
}

// On Fabric, Archers, Rogues, Wizards and Runes already sit in fabric/run/mods, so only Paladins and the Shield API come from here.
// The add-ons come from ~/.m2, so run publishToMavenLocal in an add-on after changing it.
// Datagen runs skip them, so they can't leak into the generated files.
def datagen = gradle.startParameter.taskNames.any { it.toLowerCase().contains('datagen') }
if (flags.workspace_lne_addons && !datagen) {
    def addons = ['lne_archers': '1.3.1+1.21.1', 'lne_paladins': '1.3.1+1.21.1', 'lne_rogues': '1.3.1+1.21.1', 'lne_wizards': '1.3.2+1.21.1']
    def classMods = fabric
            ? ['paladins-and-priests': '3.1.1+1.21.1', 'shield-api': '2.2.0']
            : ['archers': '3.1.1+1.21.1', 'wizards': '3.1.2+1.21.1', 'runes': '1.3.2+1.21.1', 'paladins-and-priests': '3.1.1+1.21.1',
               'rogues-and-warriors': '3.1.1+1.21.1', 'shield-api': '2.2.0', 'armor-model-api': '1.1.0+1.21.1', 'bundle-api': '1.1.0']
    classMods.each { slug, version ->
        dependencies.add('modLocalRuntime', "maven.modrinth:${slug}:${version}-${platform}") { transitive = false }
    }
    addons.each { name, version ->
        if (fabric) {
            dependencies.add('localRuntime', "com.${name}:${name}-fabric:${version}:dev-shadow") { transitive = false }
        } else {
            dependencies.add('modLocalRuntime', "com.${name}:${name}-neoforge:${version}") { transitive = false }
        }
    }
}
