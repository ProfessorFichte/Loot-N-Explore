def flags = rootProject.ext.runtimeWorkspace
def fabric = project.name == 'fabric'
def platform = project.name

if (flags.workspace_spell_engine) {
    dependencies.add('modLocalRuntime', "maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
    dependencies.add('modLocalRuntime', "maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
    dependencies.add('modLocalRuntime', "maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}")
}

if (fabric && flags.workspace_trinkets) {
    dependencies.add('modLocalRuntime', "maven.modrinth:trinkets:${project.trinkets_version}")
    dependencies.add('modLocalRuntime', "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.3")
    dependencies.add('modLocalRuntime', "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.3")
}

if (fabric && flags.workspace_thermoo) {
    dependencies.add('modLocalRuntime', "com.github.thedeathlycow:thermoo:${project.thermoo_version}")
}

if (!fabric && flags.workspace_curios) {
    dependencies.add('modLocalRuntime', "top.theillusivec4.curios:curios-neoforge:${project.curios_version}")
}
